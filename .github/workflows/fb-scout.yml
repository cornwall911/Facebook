name: Facebook Viral Posts Scout

on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'Group IDs or URLs to search (comma-separated or empty to use groups.txt)'
        required: false
        default: ''

  schedule:
    # Runs daily at 02:00 UTC (finishes before 05:00 UTC)
    # Runs 6 times a day: every 4 hours
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m patchright install chromium

      - name: Run Viral Scout Pipeline
        env:
          FB_COOKIES_JSON: ${{ secrets.FB_COOKIES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_PAGES_URL: ${{ secrets.CLOUDFLARE_PAGES_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          HEADLESS: 'true'
        run: |
          if [ -n "${{ github.event.inputs.groups }}" ]; then
            python -m fb_winner_scout run --headless --groups "${{ github.event.inputs.groups }}"
          else
            python -m fb_winner_scout run --headless --groups groups.txt
          fi

      - name: Prepare Dashboard & Auto-Push for Cloudflare
        if: always()
        run: |
          mkdir -p public
          if [ -f data/reports/dashboard.html ]; then
            cp data/reports/dashboard.html public/index.html
            cp data/reports/dashboard.html index.html
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html index.html public/source_posts.json public/run_status.json data/reports/
          git commit -m "chore(auto): update viral posts and dashboard" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || echo "Git push skipped"

      - name: Upload Artifacts (Excel & JSON & Images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viral-posts-results-${{ github.run_id }}
          path: |
            public/
            data/reports/
            data/images/
          retention-days: 14
