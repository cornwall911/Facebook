name: Facebook Viral Posts Scout

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Keywords to search (comma-separated or empty to use keywords.txt)'
        required: false
        default: ''
      groups:
        description: 'Group IDs or URLs to search (comma-separated or empty to use groups.txt)'
        required: false
        default: ''
      min_reactions:
        description: 'Minimum reactions threshold'
        required: false
        default: '2'

  schedule:
    # Runs automatically every 12 hours (00:00 UTC and 12:00 UTC)
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m patchright install chromium

      - name: Run Viral Scout Pipeline
        env:
          FB_COOKIES_JSON: ${{ secrets.FB_COOKIES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_PAGES_URL: ${{ secrets.CLOUDFLARE_PAGES_URL }}
          MIN_REACTIONS: ${{ github.event.inputs.min_reactions || '2' }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          HEADLESS: 'true'
        run: |
          ARGS="run --headless"
          if [ -n "${{ github.event.inputs.groups }}" ]; then
            ARGS="$ARGS --groups '${{ github.event.inputs.groups }}'"
          fi
          if [ -n "${{ github.event.inputs.keywords }}" ]; then
            ARGS="$ARGS --keywords '${{ github.event.inputs.keywords }}'"
          fi
          python -m fb_winner_scout $ARGS

      - name: Prepare Dashboard & Auto-Push for Cloudflare
        if: always()
        run: |
          mkdir -p public
          if [ -f data/reports/dashboard.html ]; then
            cp data/reports/dashboard.html public/index.html
            cp data/reports/dashboard.html index.html
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html index.html data/reports/
          git commit -m "chore(auto): update viral posts and dashboard" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || echo "Git push skipped"

      - name: Upload Artifacts (Excel & JSON & Images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viral-posts-results-${{ github.run_id }}
          path: |
            data/reports/
            data/images/
          retention-days: 14
